<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Aloe Display</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Aloe">
  <style>
    @font-face {
      font-family: 'Hubballi';
      src: url('/assets/Hubballi-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    
    :root {
      --aloe-green: #98B178;
      --bg: #ffffff;
      --text: #333333;
    }
    
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Hubballi', sans-serif;
      overflow: hidden;
    }
    
  h1 {
      position: absolute;
      top: 25%;            /* 距离地图顶部多远 */
      right: 12%;          /* 距离地图右边多远 */
      width: 35%;         /* 标题区域占地图宽度的百分比 */
      text-align: center;  /* 文字右对齐 / 也可以 left / center */
      font-weight: normal;
      font-size: 24px;
      letter-spacing: 1px;
      margin: 0;
      line-height: 1.4;
    }
    
#map-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-sizing: border-box;
      background: #ffffff;
    }
    
  #map {
      position: relative;
      height: 99%;
      aspect-ratio: 3 / 4;
      max-width: 90%;
      background-image: url('/assets/map.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }
    
    .dot {
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--aloe-green);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: all 0.6s ease;
      box-shadow: 0 0 16px rgba(152, 177, 120, 0.5);
    }
    
    .label {
      position: absolute;
      font-size: 12px;
      color: #98B178;
      left: 50%;
      top: 100%;
      transform: translate(-50%, 6px);
      font-family: 'Hubballi', sans-serif;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="map-wrapper">
    <div id="map">
      <h1>ALOE — Live Map</h1>
    </div>
  </div>
  
  <script>
    const map = document.getElementById('map');
    const dots = {};

    function updateDot(id, x, y) {
      let dot = dots[id];
      if (!dot) {
        dot = document.createElement('div');
        dot.className = 'dot';
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = id;
        dot.appendChild(label);
        map.appendChild(dot);
        dots[id] = dot;
      }
      dot.style.left = (x * 100) + '%';
      dot.style.top = (y * 100) + '%';
    }

    fetch('/api/leaves')
      .then(r => r.json())
      .then(data => {
        Object.entries(data).forEach(([id, pos]) => updateDot(id, pos.x, pos.y));
      });

    const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(wsProtocol + '//' + location.host);
    
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'update') {
        updateDot(msg.id, msg.x, msg.y);
      }
    };
    
    ws.onopen = () => console.log('connected to server');
    ws.onclose = () => console.log('disconnected');
  </script>
</body>
</html>
