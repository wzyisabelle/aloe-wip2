<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Plant Your Aloe</title>
  <style>
    @font-face {
      font-family: 'Hubballi';
      src: url('/assets/Hubballi-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    
    :root {
      --aloe-green: #98B178;
      --history-blue: #b4dff0;
      --trail-grey: #b8b8b8;
      --bg: #ffffff;
      --text: #333333;
    }
    
    body {
      margin: 0;
      padding-top: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Hubballi', sans-serif;
    }
    
    h1 {
      font-weight: normal;
      margin: 0 0 6px 0;
      font-size: 18px;
      letter-spacing: 1px;
    }
    
    #info {
      color: #777;
      font-size: 15px;
      margin: 0;
      line-height: 1.4;
    }
    
    #info strong {
      color: var(--aloe-green);
      font-weight: normal;
    }

    #header {
      position: absolute;
      top: 18%;
      right: 2%;
      width: 80%;
      text-align: right;
    }

    #map-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 16px;
    }
    
    #map {
      position: relative;
      width: 100%;
      max-width: 520px;
      aspect-ratio: 3 / 4;
      background-image: url('/assets/map.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      background-color: #ffffff;
      cursor: crosshair;
      touch-action: manipulation;
    }
    
    /* 轨迹SVG层 */
    #trails {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    
    /* 历史点：白填充蓝边空心圆 */
    .dot-history {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #ffffff;
      border: 1.5px solid var(--history-blue);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-sizing: border-box;
      z-index: 2;
      pointer-events: none;
    }
    
    .marker {
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--aloe-green);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 12px rgba(152, 177, 120, 0.5);
      z-index: 3;
    }
    
    #submit {
      display: block;
      margin: 18px auto 16px;
      padding: 14px 22px;
      background: var(--aloe-green);
      color: white;
      border: none;
      border-radius: 30px;/*圆角*/
      font-size: 17px;
      font-family: 'Hubballi', sans-serif;
      letter-spacing: 1px;
      cursor: pointer;
    }
    
    #submit:disabled {
      background: #d4d4d4;
    }
    
    #status {
      text-align: center;
      padding: 6px; 
      margin-top: 14px; /*地图底部到 planted! 的距离*/
      color: var(--aloe-green);
      font-size: 15px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div id="map-wrapper">
    <div id="map">
      <div id="header">
        <h1>PLANT YOUR ALOE</h1>
        <div id="info">Pin on the map<br>where you placed your <strong id="leafId">—</strong></div>
      </div>
      <svg id="trails"></svg>
    </div>
  </div>
  <div id="status"></div>
  <button id="submit" disabled>Plant Here</button>
  
  <script>
    const params = new URLSearchParams(location.search);
    const leafId = params.get('id') || 'unknown';
    document.getElementById('leafId').textContent = leafId;
    
    const map = document.getElementById('map');
    const trailsSvg = document.getElementById('trails');
    const submitBtn = document.getElementById('submit');
    const status = document.getElementById('status');
    let chosenX = null, chosenY = null;
    let marker = null;
    let history = [];
    
    // 加载这片叶子的历史
    fetch('/api/leaves/' + leafId)
      .then(r => r.json())
      .then(data => {
        history = data || [];
        renderHistory();
      });
    // 监听服务器广播（接收clear信号）
    const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(wsProtocol + '//' + location.host);
    
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'clear') {
        history = [];
        renderHistory();
        if (marker) {
          marker.remove();
          marker = null;
        }
        chosenX = null;
        chosenY = null;
        submitBtn.disabled = true;
        status.textContent = '';
      }
    };
    
    function renderHistory() {
      document.querySelectorAll('.dot-history').forEach(el => el.remove());
      trailsSvg.innerHTML = '';
      
      if (history.length === 0) return;
      
      history.forEach((pt) => {
        const dot = document.createElement('div');
        dot.className = 'dot-history';
        dot.style.left = (pt.x * 100) + '%';
        dot.style.top = (pt.y * 100) + '%';
        map.appendChild(dot);
      });
      
      drawTrail(history);
    }
    
    function drawTrail(pts) {
      if (pts.length < 2) return;
      
      trailsSvg.setAttribute('viewBox', '0 0 100 133.33');
      trailsSvg.setAttribute('preserveAspectRatio', 'none');
      
      let d = `M ${pts[0].x * 100} ${pts[0].y * 133.33}`;
      
      for (let i = 1; i < pts.length; i++) {
        const prev = pts[i - 1];
        const curr = pts[i];
        const px = prev.x * 100, py = prev.y * 133.33;
        const cx = curr.x * 100, cy = curr.y * 133.33;
        
        const mx = (px + cx) / 2;
        const my = (py + cy) / 2;
        const dx = cx - px;
        const dy = cy - py;
        const ctrlX = mx - dy * 0.15;
        const ctrlY = my + dx * 0.15;
        
        d += ` Q ${ctrlX} ${ctrlY}, ${cx} ${cy}`;
      }
      
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', 'var(--trail-grey)');
      path.setAttribute('stroke-width', '0.2');
      path.setAttribute('stroke-dasharray', '1.5 1.5');
      path.setAttribute('opacity', '0.6');
      trailsSvg.appendChild(path);
    }
    
    map.addEventListener('click', (e) => {
      if (e.target.closest('#header')) return;
      
      const rect = map.getBoundingClientRect();
      chosenX = (e.clientX - rect.left) / rect.width;
      chosenY = (e.clientY - rect.top) / rect.height;
      
      if (!marker) {
        marker = document.createElement('div');
        marker.className = 'marker';
        map.appendChild(marker);
      }
      marker.style.left = (chosenX * 100) + '%';
      marker.style.top = (chosenY * 100) + '%';
      submitBtn.disabled = false;
    });
    
    submitBtn.addEventListener('click', async () => {
      if (chosenX == null) return;
      submitBtn.disabled = true;
      status.textContent = 'planting...';
      
      try {
        const res = await fetch('/api/place', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: leafId, x: chosenX, y: chosenY })
        });
        if (res.ok) {
          status.innerHTML = "Planted!<br>You can keep transplanting it wherever you like.";
          history.push({ x: chosenX, y: chosenY, t: Date.now() });
          renderHistory();
          if (marker) {
            marker.remove();
            marker = null;
          }
          chosenX = null;
          chosenY = null;
        } else {
          status.textContent = 'error, try again';
          submitBtn.disabled = false;
        }
      } catch (err) {
        status.textContent = 'network error';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
