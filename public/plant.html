<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Plant Your Aloe</title>
  <style>
    @font-face {
      font-family: 'Hubballi';
      src: url('/assets/Hubballi-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    
    :root {
      --aloe-green: #98B178;
      --bg: #ffffff;
      --text: #333333;
    }
    
    body {
      margin: 0;
      padding-top: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Hubballi', sans-serif;
    }
    
    h1 {
      font-weight: normal;
      margin: 0 0 6px 0;
      font-size: 18px;
      letter-spacing: 1px;
    }
    
#info {
      color: #777;
      font-size: 15px;
      margin: 0;
      line-height: 1.4;
    }
    
    #info strong {
      color: var(--aloe-green);
      font-weight: normal;
    }

    #header {
      position: absolute;
      top: 18%;
      right: 2%;
      width: 80%;
      text-align: right;
    }

    #map-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 16px;
    }
    
    #map {
      position: relative;
      width: 100%;
      max-width: 520px;
      aspect-ratio: 3 / 4;
      background-image: url('/assets/map.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: #ffffff;
      cursor: crosshair;
      touch-action: manipulation;
    }
    
    .marker {
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--aloe-green);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 12px rgba(152, 177, 120, 0.5);
    }
    
    #submit {
      display: block;
      margin: 18px auto 16px;
      padding: 14px 22px;
      background: var(--aloe-green);
      color: white;
      border: none;
      border-radius: 30px;/*圆角*/
      font-size: 17px;
      font-family: 'Hubballi', sans-serif;
      letter-spacing: 1px;
      cursor: pointer;
    }
    
    #submit:disabled {
      background: #d4d4d4;
    }
    
    #status {
      text-align: center;
      padding: 6px; 
      margin-top: 14px; /*地图底部到 planted! 的距离*/
      color: var(--aloe-green);
      font-size: 15px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div id="map-wrapper">
    <div id="map">
      <div id="header">
        <h1>PLANT YOUR ALOE</h1>
        <div id="info">Pin on the map<br>where you placed your <strong id="leafId">—</strong></div>
      </div>
    </div>
  </div>
  <div id="status"></div>
  <button id="submit" disabled>Plant Here</button>
  
  <script>
    const params = new URLSearchParams(location.search);
    const leafId = params.get('id') || 'unknown';
    document.getElementById('leafId').textContent = leafId;
    
    const map = document.getElementById('map');
    const submitBtn = document.getElementById('submit');
    const status = document.getElementById('status');
    let chosenX = null, chosenY = null;
    let marker = null;
    
    map.addEventListener('click', (e) => {
      const rect = map.getBoundingClientRect();
      chosenX = (e.clientX - rect.left) / rect.width;
      chosenY = (e.clientY - rect.top) / rect.height;
      
      if (!marker) {
        marker = document.createElement('div');
        marker.className = 'marker';
        map.appendChild(marker);
      }
      marker.style.left = (chosenX * 100) + '%';
      marker.style.top = (chosenY * 100) + '%';
      submitBtn.disabled = false;
    });
    
    submitBtn.addEventListener('click', async () => {
      if (chosenX == null) return;
      submitBtn.disabled = true;
      status.textContent = 'planting...';
      
      try {
        const res = await fetch('/api/place', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: leafId, x: chosenX, y: chosenY })
        });
        if (res.ok) {
         status.innerHTML = "Planted!<br>You can keep transplanting it wherever you like.";
        } else {
          status.textContent = 'error, try again';
          submitBtn.disabled = false;
        }
      } catch (err) {
        status.textContent = 'network error';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
